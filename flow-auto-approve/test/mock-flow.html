<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mock Flow</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  main { flex: 1; overflow: auto; padding: 12px; }
  #grid { display: grid; grid-template-columns: repeat(8, 70px); gap: 4px; }
  #grid figure, #grid flow-grid-tile-container { display: block; margin: 0; width: 70px; height: 50px; background: #9cf; font-size: 10px; overflow: hidden; }
  #grid img { width: 70px; height: 36px; display: block; }
  aside { width: 380px; display: flex; flex-direction: column; border-left: 1px solid #ccc; }
  #log { flex: 1; overflow: auto; padding: 8px; }
  .msg { margin: 6px 0; padding: 6px 8px; border-radius: 8px; background: #eee; white-space: pre-wrap; max-height: 120px; overflow: hidden; }
  .msg.user { background: #def; }
  .composer { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #ccc; }
  .composer textarea, .composer [contenteditable] { flex: 1; min-height: 30px; max-height: 80px; overflow: auto; border: 1px solid #999; }
  .icon { font-family: monospace; font-size: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <!-- Distractor: a "Stop" button far away from the chat box. -->
    <button id="distractor"><span class="icon">stop</span>Stop preview</button>
    <span>Görsel: <b id="total">0</b> · <span id="progress"></span></span>
  </header>
  <div id="grid"></div>
</main>
<aside>
  <div id="log"></div>
  <div class="composer" id="composer"></div>
</aside>
<script>
  // A stand-in for Flow's agent: it makes images in batches of BATCH, stops
  // after each batch to ask "Devam edeyim mi?", and renames images the same way.
  const params = new URLSearchParams(location.search);
  const COMPOSER = params.get('composer') || 'textarea';
  const STOP_BUTTON = params.get('stop') !== '0';
  const ASK_AT_END = params.get('askAtEnd') === '1';
  const ODD = params.get('odd') === '1'; // questions the extension's phrase list does not know
  // Like the real Flow agent: runs every batch itself without asking, then
  // reports "Listedeki N sahnenin tamamı … oluşturuldu".
  const SELF = params.get('self') === '1';
  // Like the third real run: asks "…geçmemi ister misiniz?" and echoes each
  // batch's prompt texts back into the chat ("Tümünü göster").
  const REAL3 = params.get('real3') === '1';
  let stopEarlyAt = Number(params.get('stopEarlyAt') || 0); // claims to be done after this many, once
  // These prompts fail on the first try, like Flow's rate limit (THROTTLED) errors.
  const FAIL_FIRST = new Set((params.get('failFirst') || '').split(',').filter(Boolean).map(Number));
  const failed = [];
  const BATCH = Number(params.get('batch') || 20);
  const STEP_MS = Number(params.get('stepMs') || 30);

  const state = { queue: [], images: [], messages: [], phase: 'idle', busy: false, renamePrefix: '' };
  window.mockState = state;
  // Gallery tiles shaped like Flow's: aria-label, img[data-media-id], .footer-title.
  function makeTile(n) {
    const el = document.createElement('flow-grid-tile-container');
    el.setAttribute('aria-label', `#${n}`);
    el.innerHTML = `<img class="image" data-media-id="m${n}" src="/media/${n}.png"><span class="footer-title">#${n}</span>`;
    return el;
  }
  function setTileName(el, name) {
    el.setAttribute('aria-label', name);
    el.querySelector('.footer-title').textContent = name;
  }
  const nameOf = (n) => `${state.renamePrefix}${String(n).padStart(state.nameDigits || 1, '0')}`;

  const log = document.getElementById('log');
  const grid = document.getElementById('grid');
  const progress = document.getElementById('progress');
  const composer = document.getElementById('composer');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let refreshComposer = () => {};

  function bubble(text, who) {
    const div = document.createElement('div');
    div.className = `msg ${who}`;
    div.textContent = text;
    log.appendChild(div);
    return div;
  }

  function setBusy(v) {
    state.busy = v;
    refreshComposer();
  }

  async function agentSay(text) {
    setBusy(true);
    const div = bubble('', 'agent');
    const words = text.split(' ');
    for (let i = 0; i < words.length; i++) {
      div.textContent += (i ? ' ' : '') + words[i]; // streams like a real chat
      await sleep(20);
    }
    setBusy(false);
  }

  async function runGenerationSelf() {
    setBusy(true);
    while (state.queue.length) {
      const from = state.images.length + 1;
      const to = Math.min(from + BATCH - 1, from + state.queue.length - 1);
      await agentSay(from === 1 ? `İlk ${to} sahne için görselleri oluşturuyorum.`
        : `Sıradaki ${to - from + 1} sahne (${from} - ${to}) için görselleri oluşturuyorum.`);
      setBusy(true);
      for (let n = from; n <= to; n++) {
        const p = state.queue.shift();
        const fig = makeTile(p.n);
        grid.appendChild(fig);
        state.images.push({ n: p.n, prompt: p.text, name: '', el: fig });
        progress.textContent = `${n - from + 1}/${to - from + 1}`;
        await sleep(STEP_MS);
      }
      if (stopEarlyAt && state.images.length >= stopEarlyAt) {
        stopEarlyAt = 0;
        break;
      }
    }
    progress.textContent = '';
    state.phase = state.queue.length ? 'gen' : 'idle';
    await agentSay(`Listedeki ${state.images.length} sahnenin tamamı sırasıyla ve 20'şerli gruplar halinde oluşturuldu.`);
  }

  async function runRenameSelf() {
    setBusy(true);
    const todo = state.images.filter((im) => !im.name).sort((a, b) => a.n - b.n);
    for (let i = 0; i < todo.length; i += BATCH) {
      await agentSay(i ? `${i + 1}'den ${Math.min(i + BATCH, todo.length)}'e kadar olan görselleri yeniden adlandırıyorum.`
        : `İlk ${Math.min(BATCH, todo.length)} görseli yeniden adlandırıyorum.`);
      setBusy(true);
      for (const im of todo.slice(i, i + BATCH)) {
        im.name = `${nameOf(im.n)}`;
        setTileName(im.el, im.name);
        await sleep(STEP_MS);
      }
    }
    state.phase = 'idle';
    const n = state.images.length;
    await agentSay(`Oluşturulan ${n} görselin tamamı 20'şerli partiler halinde sırasıyla ` +
      `${nameOf(1)}'den ${nameOf(n)}'e kadar yeniden adlandırıldı.`);
  }

  async function runGeneration() {
    if (SELF) return runGenerationSelf();
    setBusy(true);
    let made = 0;
    const failedNow = [];
    while (state.queue.length && made < BATCH) {
      const p = state.queue.shift();
      made++;
      if (FAIL_FIRST.delete(p.n)) {
        const tile = document.createElement('figure');
        tile.textContent = 'Başarısız Bir hata oluştu. Lütfen tekrar deneyin.';
        grid.appendChild(tile);
        failed.push(p);
        failedNow.push(p.n);
        await sleep(STEP_MS);
        continue;
      }
      const fig = makeTile(p.n);
      grid.appendChild(fig);
      state.images.push({ n: p.n, prompt: p.text, name: '', el: fig });
      progress.textContent = `${made}/${BATCH}`;
      document.getElementById('total').textContent = state.images.length;
      await sleep(STEP_MS);
    }
    progress.textContent = '';
    if (REAL3) {
      const done = state.images.slice(-made);
      bubble(done.map((im) => `${im.n}. ${im.prompt}`).join('\n'), 'agent');
      if (state.queue.length) {
        state.phase = 'gen';
        const a = state.images.length + 1;
        return agentSay(`Parti (${a - made}-${a - 1} arası promptlar) başarıyla oluşturuldu. ` +
          `Sıradaki partiye (${a}-${Math.min(a + BATCH - 1, a + state.queue.length - 1)}) geçmemi ister misiniz?`);
      }
      state.phase = 'idle';
      return agentSay(`Tüm ${state.images.length} görsel oluşturuldu. Başka bir şey ister misiniz?`);
    }
    if (failedNow.length) {
      state.phase = 'gen';
      return agentSay(`Bu partide ${failedNow.join(', ')} numaralı promptlar istek limiti ` +
        '(PUBLIC_ERROR_USER_REQUESTS_THROTTLED) nedeniyle tamamlanamadı. Nasıl ilerleyelim?');
    }
    if (state.queue.length) {
      state.phase = 'gen';
      await agentSay(ODD
        ? `${state.images.length} görsel hazır. Sıradaki partiye geçelim mi?`
        : `${state.images.length} görsel oluşturuldu. Devam edeyim mi?`);
    } else {
      state.phase = ASK_AT_END ? 'gen' : 'idle';
      await agentSay(`Tüm ${state.images.length} görsel oluşturuldu.${ASK_AT_END ? ' Devam edeyim mi?' : ''}`);
    }
  }

  async function runRename() {
    if (SELF) return runRenameSelf();
    setBusy(true);
    let done = 0;
    const todo = state.images.filter((im) => !im.name).sort((a, b) => a.n - b.n);
    for (const im of todo.slice(0, BATCH)) {
      im.name = `${nameOf(im.n)}`;
      setTileName(im.el, im.name);
      done++;
      progress.textContent = `ad ${done}/${BATCH}`;
      await sleep(STEP_MS);
    }
    progress.textContent = '';
    const left = state.images.filter((im) => !im.name).length;
    state.phase = left ? 'rename' : 'idle';
    await agentSay(left
      ? (ODD ? `${state.images.length - left} görsele ad verildi. Sonrakilere geçelim mi?`
        : `${state.images.length - left} görsel isimlendirildi. Kalanları isimlendireyim mi?`)
      : 'Tüm görseller isimlendirildi.');
  }

  async function runVideos() {
    setBusy(true);
    for (const v of state.videoQueue.splice(0, state.videoBatch)) {
      const fig = document.createElement('figure');
      fig.textContent = `${v.name}_v`;
      grid.appendChild(fig);
      state.videos.push({ name: `${v.name}_v`, prompt: v.prompt });
      await sleep(STEP_MS);
    }
    state.phase = state.videoQueue.length ? 'video' : 'idle';
    await agentSay(state.videoQueue.length
      ? `${state.videos.length} video oluşturuldu. Devam edeyim mi?`
      : `Tüm ${state.videos.length} video oluşturuldu.`);
  }

  async function onUserMessage(text) {
    if (!text.trim()) return;
    state.messages.push(text);
    bubble(text, 'user');
    await sleep(100);
    if (/video oluştur/i.test(text)) {
      state.videoEngine = (text.match(/Video modeli: (.+?)\. /) || [])[1];
      state.videoBatch = Number((text.match(/(\d+) adetlik/) || [])[1]) || BATCH;
      state.videoQueue = [...text.matchAll(/^\s*(\d+)[.)]\s+(.+)$/gm)].map((m) => ({ name: m[1], prompt: m[2] }));
      state.videos = [];
      await agentSay(`Tamam, ${state.videoQueue.length} video oluşturuyorum.`);
      return runVideos();
    }
    const prompts = [...text.matchAll(/^\s*(\d+)[.)]\s+(.+)$/gm)].map((m) => ({ n: Number(m[1]), text: m[2].trim() }));
    if (prompts.length) {
      state.queue.push(...prompts);
      await agentSay(`Tamam, ${prompts.length} görsel oluşturuyorum.`);
      return runGeneration();
    }
    if (/yeniden dene/i.test(text)) {
      state.queue.unshift(...failed.splice(0));
      return runGeneration();
    }
    if (/gözden geçir/i.test(text)) {
      for (const im of state.images) if (!im.name) { im.name = nameOf(im.n); setTileName(im.el, im.name); }
      const total = Number((text.match(/ile \D*?(\d+) arasındaki/) || [])[1]);
      return agentSay(`Tüm ${total} görselin adı doğru.`);
    }
    if (/kontrol et/i.test(text)) {
      const have = new Set(state.images.map((im) => im.n));
      const total = Number((text.match(/1 ile (\d+)/) || [])[1]);
      for (const p of failed.splice(0)) if (!have.has(p.n)) state.queue.push(p);
      if (state.queue.length) await runGeneration();
      return agentSay(`Tüm ${total} promptun görseli hazır.`);
    }
    if (/adland|isimlendir/i.test(text)) {
      const first = (text.match(/adı\s+([^\s,]+)/) || [])[1] || 'img1';
      state.renamePrefix = first.replace(/\d+$/, '');
      state.nameDigits = (first.match(/\d+$/) || ['1'])[0].length;
      await agentSay('Tamam, görselleri yeniden adlandırıyorum.');
      return runRename();
    }
    if (/devam|evet|continue|yes/i.test(text)) {
      if (state.phase === 'gen' && state.queue.length) return runGeneration();
      if (state.phase === 'rename') return runRename();
      if (state.phase === 'video') return runVideos();
      state.phase = 'idle';
      return agentSay('Yapılacak başka bir şey kalmadı.');
    }
    return agentSay('Anlamadım.');
  }
  window.mockUserSays = onUserMessage;

  const stop = document.createElement('button');
  stop.setAttribute('aria-label', 'Stop');
  stop.innerHTML = '<span class="icon">stop_circle</span>';

  if (COMPOSER === 'textarea') {
    // Emulates a React controlled input: assigning `value` from page code is
    // tracked, so only real (or prototype-setter) edits reach the app state.
    const ta = document.createElement('textarea');
    ta.placeholder = 'Flow\'a bir şey sorun';
    const send = document.createElement('button');
    send.setAttribute('aria-label', 'Send message');
    send.innerHTML = '<span class="icon">arrow_upward</span>';
    const desc = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
    let tracked = '';
    let appValue = '';
    Object.defineProperty(ta, 'value', {
      configurable: true,
      get() { return desc.get.call(this); },
      set(v) { tracked = String(v); desc.set.call(this, v); },
    });
    ta.addEventListener('input', () => {
      const actual = desc.get.call(ta);
      if (actual === tracked) return; // React would bail out here
      tracked = actual;
      appValue = actual;
      refreshComposer();
    });
    send.addEventListener('click', () => {
      if (send.disabled) return;
      const text = appValue;
      appValue = '';
      ta.value = '';
      refreshComposer();
      onUserMessage(text);
    });
    refreshComposer = () => {
      send.disabled = state.busy || !appValue.trim();
      send.style.display = STOP_BUTTON && state.busy ? 'none' : '';
      stop.style.display = STOP_BUTTON && state.busy ? '' : 'none';
    };
    composer.append(ta, send, stop);
  } else if (COMPOSER === 'pm') {
    // Like Flow's prompt box: a ProseMirror editor and an "Oluşturmaya başla"
    // (arrow_forward) button that is disabled while the box is empty.
    const pm = document.createElement('div');
    pm.className = 'ProseMirror';
    pm.contentEditable = 'true';
    const send = document.createElement('button');
    send.className = 'mdc-icon-button generate-icon-button';
    send.setAttribute('aria-label', 'Oluşturmaya başla');
    send.innerHTML = '<i class="icon">arrow_forward</i>';
    const text = () => Array.from(pm.querySelectorAll('p')).map((p) => p.textContent).join('\n') || pm.textContent;
    pm.addEventListener('paste', (e) => {
      e.preventDefault();
      pm.textContent = '';
      for (const line of e.clipboardData.getData('text/plain').split('\n')) {
        const p = document.createElement('p');
        p.textContent = line;
        pm.appendChild(p);
      }
      refreshComposer();
    });
    pm.addEventListener('input', () => refreshComposer());
    send.addEventListener('click', () => {
      if (send.disabled) return;
      const t = text();
      pm.textContent = '';
      refreshComposer();
      onUserMessage(t);
    });
    refreshComposer = () => {
      send.disabled = state.busy || !text().trim();
      stop.style.display = STOP_BUTTON && state.busy ? '' : 'none';
    };
    composer.append(pm, send, stop);
  } else {
    // A rich-text editor: handles paste itself, one <p> per line, Enter sends.
    const ce = document.createElement('div');
    ce.contentEditable = 'true';
    ce.setAttribute('role', 'textbox');
    ce.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      ce.textContent = '';
      for (const line of text.split('\n')) {
        const p = document.createElement('p');
        p.textContent = line;
        ce.appendChild(p);
      }
    });
    ce.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      e.preventDefault();
      if (state.busy) return;
      const text = Array.from(ce.querySelectorAll('p')).map((p) => p.textContent).join('\n') || ce.textContent;
      ce.textContent = '';
      onUserMessage(text);
    });
    refreshComposer = () => { stop.style.display = STOP_BUTTON && state.busy ? '' : 'none'; };
    composer.append(ce, stop);
  }
  refreshComposer();

  document.getElementById('distractor').addEventListener('click', () => { state.distractorClicks = (state.distractorClicks || 0) + 1; });
  bubble('Merhaba! Ne oluşturmak istersiniz?', 'agent');
</script>
</body>
</html>
